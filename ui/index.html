<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Speedometer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="speedometer-container">
    <main class="speedometer-hud">

        <!-- Footer: Odometer -->
        <div class="hud-footer">
            <div>ODOMETER</div>
            <div id="odometer">0.0 Miles</div>
        </div>

        <!-- Body: Speed + RPM/Gear/Fuel -->
        <div class="hud-body">

            <!-- Speed gauge -->
            <div class="analog-section">
                <div class="gauge-outline">
                    <!-- RPM Arc SVG -->
                    <svg class="rpm-arc-svg" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10,100 A90,90 0 0,1 190,100"
                              fill="none" stroke="rgba(255,40,0,0.15)" stroke-width="10" stroke-linecap="round"/>
                        <path id="rpm-arc-fill" d="M10,100 A90,90 0 0,1 190,100"
                              fill="none" stroke="url(#fireGrad)" stroke-width="10" stroke-linecap="round"
                              stroke-dasharray="283" stroke-dashoffset="283"/>
                        <defs>
                            <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%"   stop-color="#ff2200"/>
                                <stop offset="55%"  stop-color="#ff6600"/>
                                <stop offset="100%" stop-color="#ffdd00"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="speed-display">
                        <span id="speed">0</span>
                        <span class="speed-unit-label">MPH</span>
                    </div>
                </div>
            </div>

            <!-- Data section: RPM bar, Gear, Fuel -->
            <div class="data-section">
                <div class="data-box rpm-container">
                    <label>RPM</label>
                    <div class="rpm-bar-background">
                        <div id="rpm-progress-bar" class="rpm-bar-fill"></div>
                    </div>
                </div>
                <div class="data-box">
                    <label>GEAR</label>
                    <span id="gear">N</span>
                </div>
                <div class="data-box highlight">
                    <label>FUEL</label>
                    <span id="fuel">100</span>
                </div>
            </div>

        </div>

        <!-- Header: Health + icons -->
        <div class="hud-header">
            <div class="status-item">Health: <span id="health">100%</span></div>
            <div class="status-icons">
                <svg id="left-indicator-icon" class="hud-icon" viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg>
                <svg id="headlights-icon" class="hud-icon" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3"/><path d="M12 9h8M12 12h8M12 15h8"/></svg>
                <svg id="engine-icon" class="hud-icon" viewBox="0 0 24 24"><path d="M3 10h2v4H3v-4zm18 0h-2v4h2v-4zM7 7h10v10H7V7z"/></svg>
                <svg id="seatbelt-icon" class="hud-icon" viewBox="0 0 24 24"><path d="M5 7l14 10M19 7L5 17"/></svg>
                <svg id="right-indicator-icon" class="hud-icon" viewBox="0 0 24 24"><path d="M10 7l5 5-5 5V7z"/></svg>
            </div>
        </div>

        <!-- Vehicle info -->
        <div class="vehicle-info-group">
            <div id="veh-name" class="top-vehicle-name">🔥 FIRE SPEEDO</div>
            <div class="top-plate-box">
                <label>Plate</label>
                <span id="veh-plate">N/A</span>
            </div>
        </div>

    </main>
</div>

<!-- Hidden data elements — server writes here -->
<div class="hidden-data">
    <span id="engine">Off</span>
    <span id="headlights">Off</span>
    <span id="indicators">Off / Off</span>
    <span id="seatbelts">On</span>
    <span id="rpm">0.0000</span>
</div>

<script src="scripts/script.js"></script>

<script>
// --- Observers: sync visual dari hidden elements ---

// Engine icon
const observeStandard = (id, iconId, activeText, isWarning = false) => {
    const target = document.getElementById(id);
    const icon   = document.getElementById(iconId);
    if (!target || !icon) return;
    const update = () => {
        const val = target.innerText.trim().toLowerCase();
        if (val === activeText.toLowerCase()) icon.classList.add(isWarning ? 'warning' : 'active');
        else icon.classList.remove('warning', 'active');
    };
    new MutationObserver(update).observe(target, { childList: true, characterData: true, subtree: true });
};

// Headlights icon
const observeHeadlights = () => {
    const target = document.getElementById('headlights');
    const icon   = document.getElementById('headlights-icon');
    if (!target || !icon) return;
    const update = () => {
        const val = target.innerText.trim();
        icon.classList.remove('active', 'glow-high');
        if (val === 'On')        icon.classList.add('active');
        else if (val === 'High Beam') icon.classList.add('glow-high');
    };
    new MutationObserver(update).observe(target, { childList: true, characterData: true, subtree: true });
};

// RPM progress bar (dari hidden #rpm)
const observeRPM = () => {
    const target      = document.getElementById('rpm');
    const progressBar = document.getElementById('rpm-progress-bar');
    const arcFill     = document.getElementById('rpm-arc-fill');
    if (!target || !progressBar) return;
    const update = () => {
        const val = parseFloat(target.innerText.trim());
        if (isNaN(val)) return;
        progressBar.style.width = `${Math.min(100, Math.max(0, val * 100))}%`;
        // Sync arc SVG juga
        if (arcFill) {
            const offset = 283 - (Math.min(1, val) * 283 * 0.75);
            arcFill.style.strokeDashoffset = offset.toFixed(2);
        }
    };
    new MutationObserver(update).observe(target, { childList: true, characterData: true, subtree: true });
};

// Indicators
const observeIndicators = () => {
    const target = document.getElementById('indicators');
    if (!target) return;
    const update = () => {
        const parts = target.innerText.split(' / ');
        const left  = document.getElementById('left-indicator-icon');
        const right = document.getElementById('right-indicator-icon');
        if (left)  parts[0]?.trim().toLowerCase() === 'on' ? left.classList.add('active')  : left.classList.remove('active');
        if (right) parts[1]?.trim().toLowerCase() === 'on' ? right.classList.add('active') : right.classList.remove('active');
    };
    new MutationObserver(update).observe(target, { childList: true, characterData: true, subtree: true });
};

document.addEventListener('DOMContentLoaded', () => {
    observeHeadlights();
    observeRPM();
    observeIndicators();
    observeStandard('engine',   'engine-icon',   'On');
    observeStandard('seatbelts','seatbelt-icon',  'Off', true);
});
</script>

</body>
</html>
